<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>柏吉翠 · 跳一跳</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
    background:linear-gradient(#0a0418 0%,#2a0845 60%,#ff3cac 130%);font-family:"Courier New",monospace;color:#fff}
  canvas{position:fixed;inset:0;width:100vw!important;height:100vh!important;image-rendering:pixelated;image-rendering:crisp-edges}
  .ui{position:fixed;left:0;right:0;text-align:center;pointer-events:none;font-weight:bold}
  #score{top:6vh;font-size:48px;color:#fffb96;text-shadow:0 0 8px #fffb96,0 0 18px #ff3cac}
  #best{top:calc(6vh + 56px);font-size:13px;color:#2bd2ff;text-shadow:0 0 6px #2bd2ff}
  #msg{top:22vh;font-size:20px;color:#ff3cac;text-shadow:0 0 6px #ff3cac,0 0 14px #ff3cac;transition:opacity .4s,transform .4s}
  #panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(10,4,24,.6);pointer-events:none;text-align:center}
  #panel h1{margin:0;font-size:56px;color:#ff3cac;text-shadow:0 0 10px #ff3cac,0 0 30px #ff3cac;letter-spacing:6px}
  #panel h2{margin:6px 0 30px;font-size:20px;color:#2bd2ff;text-shadow:0 0 8px #2bd2ff;letter-spacing:8px}
  #panel p{margin:6px;color:#fffb96;text-shadow:0 0 6px #fffb96}
  .blink{animation:b 1s steps(2) infinite}@keyframes b{50%{opacity:0}}
  .heart{font-size:56px;color:#ff3cac;text-shadow:0 0 16px #ff3cac;animation:beat .8s infinite}
  @keyframes beat{50%{transform:scale(1.2)}}
</style>
</head>
<body>
<div id="score" class="ui">0</div>
<div id="best" class="ui">BEST 0</div>
<div id="msg" class="ui"></div>
<div id="panel"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- 音效 ----------
let AC,chargeOsc;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type='square',v=.08,f2,delay=0){const a=ac(),o=a.createOscillator(),gn=a.createGain(),t=a.currentTime+delay;
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(gn).connect(a.destination);o.start(t);o.stop(t+d);}
const SFX={
  start(){[523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.07,0,i*.08));},
  chargeOn(){const a=ac();chargeOsc=a.createOscillator();const gn=a.createGain();chargeOsc.type='triangle';
    chargeOsc.frequency.setValueAtTime(200,a.currentTime);chargeOsc.frequency.linearRampToValueAtTime(900,a.currentTime+1.5);
    gn.gain.value=.05;chargeOsc.connect(gn).connect(a.destination);chargeOsc.start();},
  chargeOff(){if(chargeOsc){chargeOsc.stop();chargeOsc=null;}},
  jump(){tone(300,.15,'square',.07,800);},
  land(){tone(180,.08,'triangle',.12,90);},
  perfect(c){const b=[659,784,988,1175,1319][Math.min(c-1,4)];tone(b,.1,'square',.07);tone(b*1.5,.15,'square',.06,0,.08);},
  heart(){[880,1109,1319,1760].forEach((f,i)=>tone(f,.1,'triangle',.08,0,i*.05));},
  over(){[392,330,262,196].forEach((f,i)=>tone(f,.2,'sawtooth',.06,0,i*.15));}
};

// ---------- 场景 ----------
const PIXEL=0.35; // 像素化程度：越小越像素
const NEON=[0xff3cac,0x2bd2ff,0xb967ff,0xfffb96,0x05ffa1];
const LOVE=['柏吉翠 我喜欢你','每一跳都奔向你','你是我的霓虹','心跳 +1','翠翠最可爱','和你一起跳到永远','满世界都是你','Perfect Love ♥'];
const renderer=new THREE.WebGLRenderer({antialias:false,alpha:true});
renderer.setPixelRatio(PIXEL);document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-1,1,1,-1,0.1,200);
const CAM_OFF=new THREE.Vector3(-14,18,14);
function resize(){const w=innerWidth,h=innerHeight,s=8.5,a=w/h;
  renderer.setSize(w,h,false);
  if(a<1){cam.left=-s;cam.right=s;cam.top=s/a;cam.bottom=-s/a;}else{cam.left=-s*a;cam.right=s*a;cam.top=s;cam.bottom=-s;}
  cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
scene.add(new THREE.AmbientLight(0x8866ff,.7));
const sun=new THREE.DirectionalLight(0xffc0f0,.9);sun.position.set(-5,12,8);scene.add(sun);
const grid=new THREE.GridHelper(120,60,0xff3cac,0x6a2bb0);grid.material.transparent=true;grid.material.opacity=.5;scene.add(grid);

function pixelTex(rows,color){const c=document.createElement('canvas');c.width=rows[0].length;c.height=rows.length;const x=c.getContext('2d');
  x.fillStyle=color;rows.forEach((r,j)=>[...r].forEach((ch,i)=>ch==='#'&&x.fillRect(i,j,1,1)));
  const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;return t;}
const heartTex=pixelTex(['.##.##.','#######','#######','.#####.','..###..','...#...'],'#ff3cac');

// 玩家：像素风棋子
const player=new THREE.Group();
const pink=new THREE.MeshLambertMaterial({color:0xff7ac8,emissive:0x501030});
const body=new THREE.Mesh(new THREE.CylinderGeometry(.25,.4,1.1,8),pink);body.position.y=.55;
const head=new THREE.Mesh(new THREE.SphereGeometry(.3,8,6),new THREE.MeshLambertMaterial({color:0xffd6e8,emissive:0x402030}));head.position.y=1.4;
const bow=new THREE.Mesh(new THREE.BoxGeometry(.4,.15,.15),new THREE.MeshBasicMaterial({color:0x2bd2ff}));bow.position.set(0,1.72,0);
player.add(body,head,bow);scene.add(player);
const inner=player; // 方便旋转

// ---------- 游戏状态 ----------
let plats=[],parts=[],S;
const $=id=>document.getElementById(id);
function mkPlat(pos,size,shape){
  const color=NEON[Math.random()*NEON.length|0];
  const geo=shape==='box'?new THREE.BoxGeometry(size,1,size):new THREE.CylinderGeometry(size/2,size/2,1,12);
  geo.translate(0,.5,0);
  const g=new THREE.Group();
  const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:0x1a0533,emissive:color,emissiveIntensity:.25}));
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color}));
  g.add(m,e);g.position.copy(pos);scene.add(g);
  const p={g,size,shape,color,heart:null};
  if(plats.length>1&&Math.random()<.35){p.heart=new THREE.Sprite(new THREE.SpriteMaterial({map:heartTex}));p.heart.scale.set(.8,.7,1);
    p.heart.position.set(pos.x,1.9,pos.z);scene.add(p.heart);}
  plats.push(p);return p;
}
function addNext(){const c=plats[plats.length-1];
  const dir=Math.random()<.5?new THREE.Vector3(1,0,0):new THREE.Vector3(0,0,-1);
  const size=1.4+Math.random()*1.6;
  const dist=c.size/2+size/2+1+Math.random()*2.6;
  mkPlat(c.g.position.clone().addScaledVector(dir,dist),size,Math.random()<.5?'box':'cyl');
  while(plats.length>8){const o=plats.shift();scene.remove(o.g);if(o.heart)scene.remove(o.heart);}
}
function reset(){
  plats.forEach(p=>{scene.remove(p.g);if(p.heart)scene.remove(p.heart)});plats=[];
  mkPlat(new THREE.Vector3(0,0,0),2.4,'box');addNext();
  player.position.set(0,1,0);player.rotation.set(0,0,0);player.scale.set(1,1,1);
  S=Object.assign(S||{},{state:S?S.state:'title',score:0,charge:0,charging:false,jump:null,fall:null,combo:0});
  S.best=+(localStorage.bjcBest||0);updHUD();
  camTarget.copy(focusPoint());cam.position.copy(camTarget).add(CAM_OFF);cam.lookAt(camTarget);
}
const camTarget=new THREE.Vector3();
function focusPoint(){const a=plats[plats.length-2].g.position,b=plats[plats.length-1].g.position;return a.clone().add(b).multiplyScalar(.5);}
function updHUD(){$('score').textContent=S.score;$('best').textContent='BEST '+S.best;}
function showPanel(html){$('panel').innerHTML=html;$('panel').style.display=html?'flex':'none';}
let msgTimer;function say(t){const m=$('msg');m.textContent=t;m.style.opacity=1;m.style.transform='translateY(0)';
  clearTimeout(msgTimer);msgTimer=setTimeout(()=>{m.style.opacity=0;m.style.transform='translateY(-20px)'},1400);}
function burst(pos,color,n=18){for(let i=0;i<n;i++){const m=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.12),new THREE.MeshBasicMaterial({color}));
  m.position.copy(pos);scene.add(m);parts.push({m,v:new THREE.Vector3((Math.random()-.5)*6,Math.random()*6+2,(Math.random()-.5)*6),l:1});}}
function onPlat(p,pos){const dx=pos.x-p.g.position.x,dz=pos.z-p.g.position.z,r=p.size/2;
  return p.shape==='box'?Math.abs(dx)<=r&&Math.abs(dz)<=r:dx*dx+dz*dz<=r*r;}

// ---------- 输入 ----------
function down(e){e.preventDefault();
  if(S.state==='title'||S.state==='over'){if(S.state==='over'){S.state='play';reset();}S.state='play';showPanel('');SFX.start();return;}
  if(S.state==='play'&&!S.jump&&!S.fall){S.charging=true;S.charge=0;SFX.chargeOn();}}
function up(e){if(!S.charging)return;e.preventDefault();S.charging=false;SFX.chargeOff();SFX.jump();
  const cur=plats[plats.length-2],nxt=plats[plats.length-1];
  const dir=nxt.g.position.clone().sub(player.position);dir.y=0;dir.normalize();
  const dist=S.charge*7.5;
  S.jump={t:0,from:player.position.clone(),to:player.position.clone().addScaledVector(dir,dist),
    axis:new THREE.Vector3(0,1,0).cross(dir).normalize(),y0:1};
  cur.g.scale.y=1;player.scale.set(1,1,1);}
renderer.domElement.addEventListener('pointerdown',down);$('panel').addEventListener('pointerdown',down);
addEventListener('pointerup',up);
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat)down(e)});
addEventListener('keyup',e=>{if(e.code==='Space')up(e)});

// ---------- 落地判定 ----------
function land(){const cur=plats[plats.length-2],nxt=plats[plats.length-1],pos=player.position;
  player.quaternion.identity();
  if(onPlat(nxt,pos)){
    SFX.land();
    const d=Math.hypot(pos.x-nxt.g.position.x,pos.z-nxt.g.position.z);
    const perfect=d<.3;
    S.combo=perfect?S.combo+1:0;S.score+=perfect?2*S.combo:1;
    if(perfect){SFX.perfect(S.combo);say('PERFECT! '+LOVE[Math.random()*LOVE.length|0]);ripple(nxt);}
    else if(S.score%5===0)say(LOVE[Math.random()*LOVE.length|0]);
    if(nxt.heart){scene.remove(nxt.heart);nxt.heart=null;S.score+=3;SFX.heart();say('+3 ♥ 柏吉翠的心');
      burst(new THREE.Vector3(pos.x,2,pos.z),0xff3cac,30);}
    burst(new THREE.Vector3(pos.x,1.05,pos.z),nxt.color,10);
    updHUD();addNext();
  }else if(onPlat(cur,pos)){SFX.land();}
  else{ // 掉落：判断是否擦边，擦边则向外倾倒
    S.fall={t:0};SFX.over();
  }
}
const ripples=[];
function ripple(p){const m=new THREE.Mesh(new THREE.RingGeometry(.3,.45,16),new THREE.MeshBasicMaterial({color:0xfffb96,transparent:true,side:THREE.DoubleSide}));
  m.rotation.x=-Math.PI/2;m.position.set(p.g.position.x,1.02,p.g.position.z);scene.add(m);ripples.push({m,t:0});}

function gameOver(){S.state='over';S.best=Math.max(S.best,S.score);localStorage.bjcBest=S.best;updHUD();
  showPanel(`<div class="heart">♥</div><h1 style="font-size:40px">GAME OVER</h1><p style="font-size:22px">得分 ${S.score}</p>
  <p style="color:#2bd2ff">${S.score>=S.best&&S.score>0?'新纪录！柏吉翠最棒 ♥':'柏吉翠，再来一次嘛 ♥'}</p><p class="blink" style="margin-top:24px">点击重新开始</p>`);}

// ---------- 主循环 ----------
let last=performance.now();
function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;
  const cur=plats[plats.length-2];
  if(S.charging){S.charge=Math.min(S.charge+dt/1.5,1);
    const k=1-S.charge*.35;cur.g.scale.y=k;player.position.y=k;player.scale.set(1+S.charge*.2,1-S.charge*.4,1+S.charge*.2);}
  if(S.jump){const j=S.jump;j.t=Math.min(j.t+dt/.38,1);
    player.position.lerpVectors(j.from,j.to,j.t);player.position.y=1+Math.sin(Math.PI*j.t)*2.6;
    player.quaternion.setFromAxisAngle(j.axis,Math.PI*2*j.t);
    if(j.t>=1){S.jump=null;player.position.y=1;land();}}
  if(S.fall){S.fall.t+=dt;player.position.y=Math.max(0,1-S.fall.t*4);player.rotation.z=Math.min(S.fall.t*4,Math.PI/2);
    if(S.fall.t>.6){S.fall=null;gameOver();}}
  plats.forEach(p=>{if(p.heart)p.heart.position.y=1.9+Math.sin(now/250)*.15;});
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt*1.5;p.v.y-=15*dt;p.m.position.addScaledVector(p.v,dt);
    if(p.l<=0){scene.remove(p.m);parts.splice(i,1);}}
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.t+=dt;r.m.scale.setScalar(1+r.t*6);r.m.material.opacity=1-r.t*1.5;
    if(r.t>.66){scene.remove(r.m);ripples.splice(i,1);}}
  camTarget.lerp(focusPoint(),.15);cam.position.copy(camTarget).add(CAM_OFF);cam.lookAt(camTarget);
  grid.position.set(Math.round(camTarget.x/2)*2,0,Math.round(camTarget.z/2)*2);
  renderer.render(scene,cam);requestAnimationFrame(loop);}
reset();
showPanel(`<div class="heart">♥</div><h1>柏吉翠</h1><h2>跳·一·跳</h2><p class="blink">点击 / 空格 开始</p><p style="color:#b967ff;font-size:13px">按住蓄力 松开跳跃</p>`);
requestAnimationFrame(loop);
</script>
</body>
</html>
