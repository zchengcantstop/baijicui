<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>柏吉翠 · 小游戏</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#ffd9e6 0%,#ffeef3 45%,#fff7ef 100%);
    font-family:"Zen Maru Gothic","PingFang SC","Microsoft YaHei",sans-serif;color:#d94f7c;-webkit-tap-highlight-color:transparent}
  main{max-width:720px;margin:0 auto;padding:8vh 16px 40px;text-align:center}
  h1{margin:0;font-size:48px;letter-spacing:8px;font-weight:900;color:#e85e8c}
  .sub{margin:6px 0 36px;color:#c48aa0;letter-spacing:6px;font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
  a.card{display:block;text-decoration:none;color:inherit;background:rgba(255,255,255,.85);border:2px solid #ffd0de;border-radius:28px;
    padding:28px 20px;box-shadow:0 12px 32px rgba(232,94,140,.2);transition:transform .2s,box-shadow .2s}
  a.card:hover,a.card:active{transform:translateY(-4px);box-shadow:0 16px 40px rgba(232,94,140,.32)}
  .icon{font-size:56px;line-height:1}
  .name{margin-top:12px;font-size:24px;font-weight:900;letter-spacing:4px}
  .desc{margin-top:8px;font-size:14px;color:#c48aa0;line-height:1.6}
  .tag{display:inline-block;margin-top:12px;padding:3px 12px;border-radius:12px;background:#ffe3ec;font-size:12px;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>柏吉翠</h1>
  <div class="sub">小 游 戏 合 集</div>
  <div class="grid">
    <a class="card" href="jump.html">
      <div class="icon">🐰</div>
      <div class="name">跳一跳</div>
      <div class="desc">按住蓄力，松手起跳<br>落在中心有额外加分</div>
      <span class="tag">单人</span>
    </a>
    <a class="card" href="fireice.html">
      <div class="icon">🔥💧</div>
      <div class="name">冰火人</div>
      <div class="desc">火娃怕水，冰娃怕火<br>两人配合，一起走到出口</div>
      <span class="tag">双人 · 联网 / 同屏</span>
    </a>
  </div>
</main>
</body>
</html>
